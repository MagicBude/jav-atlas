# minnano 资料回填：读取已有名册，只补 nick、official、mcanon、alias 等缺失字段。
# nick/official 的遗漏会造成资料不全，改名人物缺 mcanon 会影响现用名检索。
# 资料用于定时同步消费；NAS 每日 04:00 合并是部署配置样例，当前仓库没有实现该消费流程。
# 源站网络记录包括机房可访问、代理 WAF 403 与 Cloudflare 拦截，当前可达性需实测。
# schedule 使用 UTC，北京时间为 UTC+8；触发时间不保证实际开始或完成时间。
name: profiles-relay

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full = 全量 ~2.5 万页（1~2 小时）；留空 = 只补缺 愛称/公式サイト 的'
        required: false
        default: 'full'
  schedule:
    - cron: '50 22 * * *' # UTC 22:50 = 北京时间 06:50，排在 rank-relay（21:30）之后
# 提交采集结果需要 contents: write；仓库权限或分支规则仍可能拒绝写入。
permissions:
  contents: write

# 只限制本工作流的并行运行，不协调其他工作流的 git push。
concurrency:
  group: profiles-relay
  cancel-in-progress: false

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 手动 scope 默认 full（样本约 2.5 万页、1～2 小时），定时 scope 留空采用增量筛选。
      # 增量是缺 nick 或 official；ONLY/full 也仍受脚本内部 TTL 过滤。
      - name: 抓取 minnano 资料页并回填名册
        run: node tools/profiles-relay.js ${{ github.event.inputs.scope || '' }}
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/roster.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: minnano 资料页回填 $(date -u +%F)"
            git push
          fi
