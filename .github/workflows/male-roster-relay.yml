# 固定种子男演员任务：搜索、详情及补图。注意脚本默认写 tools/relay，而本工作流提交根 relay；该路径问题本次保留。
# 定时表达式使用 UTC，注释中的北京时间为 UTC+8；触发不等于准点完成。
# concurrency 只防止同名任务重叠，不协调其他工作流的 git push。
# contents: write 用于提交产物；分支规则或仓库权限仍可能阻止 push。
# 源站可达性、IP 限流和身份判定须以实际运行结果为准。
# JavDB 男优资料云端中转：Actions 机房直连国内线路（应用级签名，与账号无关），抓男优名单+头像，
# 提交 relay/roster_male.json 与 relay/avatars_male/。前端演员页「男优」大 tab 首次从
# raw.githubusercontent.com 拉回本地（国内可达），之后走本地缓存。
# 补充：上述网络、数据规模或主应用部署说明为上游历史背景，当前仓库和运行环境尚未验证。
name: male-roster-relay

on:
  schedule:
    - cron: '40 21 * * *' # UTC 21:40 = 北京时间 05:40，错开 rank-relay(21:30)
  workflow_dispatch:

# 以下仅声明运行权限，不改变代码或文件的公开/私有属性。
permissions:
  contents: write

concurrency:
  group: male-roster-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    # checkout 获取当前仓库代码；setup-node 固定 Node 主版本；后续采集失败会阻止提交步骤。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取 JavDB 男优名单与头像
        run: node tools/male-roster-relay.js
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/roster_male.json relay/avatars_male/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: JavDB 男优名单与头像更新 $(date -u +%F)"
            git push
          fi
