# JavDB 男演员采集：按固定种子搜索，获取资料与头像并保存名单。
# 公开数据可经 raw.githubusercontent.com 获取，消费端可在首次拉取后缓存；当前未实现浏览端。
# API 使用应用级签名，不需要用户登录。脚本默认输出 tools/relay/，与工作流提交的根 relay/ 不一致。
# 源站网络记录包括机房可访问、代理 WAF 403 与 Cloudflare 拦截，当前可达性需实测。
# schedule 使用 UTC，北京时间为 UTC+8；触发时间不保证实际开始或完成时间。
name: male-roster-relay

on:
  schedule:
    - cron: '40 21 * * *' # UTC 21:40 = 北京时间 05:40，错开 rank-relay(21:30)
  workflow_dispatch:
# 提交采集结果需要 contents: write；仓库权限或分支规则仍可能拒绝写入。
permissions:
  contents: write

# 只限制本工作流的并行运行，不协调其他工作流的 git push。
concurrency:
  group: male-roster-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取 JavDB 男优名单与头像
        run: node tools/male-roster-relay.js
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/roster_male.json relay/avatars_male/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: JavDB 男优名单与头像更新 $(date -u +%F)"
            git push
          fi
