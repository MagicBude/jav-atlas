# minnano 榜单与头像采集：生成日/周/月榜，随后补齐已有名册的头像。
# 采集与分发分离：公开仓库可经 raw.githubusercontent.com 或 cdn.jsdelivr.net 提供静态数据，无需读取 token。
# 家庭网络曾发生 SNI 阻断（TCP 握手后 RST）；GitHub 托管 runner 可作为另一个网络出口。
# 源站网络记录包括机房可访问、代理 WAF 403 与 Cloudflare 拦截，当前可达性需实测。
# schedule 使用 UTC，北京时间为 UTC+8；触发时间不保证实际开始或完成时间。
name: rank-relay

on:
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 北京时间 05:30，日榜刚更新
  workflow_dispatch:
    inputs:
      full:
        description: '填 full = 全量回填名册头像（一次约 1~2 小时）'
        required: false
        default: ''
# 提交采集结果需要 contents: write；仓库权限或分支规则仍可能拒绝写入。
permissions:
  contents: write

# 只限制本工作流的并行运行，不协调其他工作流的 git push。
concurrency:
  group: rank-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取 minnano 榜单与榜上头像
        run: node tools/rank-relay.js
      # full 不限数量，约 2.4 万张、1～2 小时为回填规模/耗时样本；普通运行每轮最多 400 个缺图任务。
      # 此步骤需要 relay/roster.json；只有榜单抓取不依赖已有名册。
      - name: 全量回填名册头像（手动触发且填了 full）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'full'
        run: node tools/roster-avatars.js full
      - name: 增量回填名册头像（每日 400 个）
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.full != 'full'
        run: node tools/roster-avatars.js 400
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: minnano 榜单与头像更新 $(date -u +%F)"
            git push
          fi
