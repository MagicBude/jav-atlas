# minnano 榜单任务：先抓三种榜及部分头像，再按 full 条件执行不限量或 400 条名册补图；第二步依赖已有名册。
# 定时表达式使用 UTC，注释中的北京时间为 UTC+8；触发不等于准点完成。
# concurrency 只防止同名任务重叠，不协调其他工作流的 git push。
# contents: write 用于提交产物；分支规则或仓库权限仍可能阻止 push。
# 源站可达性、IP 限流和身份判定须以实际运行结果为准。
name: rank-relay

on:
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 北京时间 05:30，日榜刚更新
  workflow_dispatch:
    inputs:
      full:
        description: '填 full = 全量回填名册头像（一次约 1~2 小时）'
        required: false
        default: ''

# 以下仅声明运行权限，不改变代码或文件的公开/私有属性。
permissions:
  contents: write

concurrency:
  group: rank-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    # checkout 获取当前仓库代码；setup-node 固定 Node 主版本；后续采集失败会阻止提交步骤。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取 minnano 榜单与榜上头像
        run: node tools/rank-relay.js
      - name: 全量回填名册头像（手动触发且填了 full）
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'full'
        run: node tools/roster-avatars.js full
      - name: 增量回填名册头像（每日 400 个）
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.full != 'full'
        run: node tools/roster-avatars.js 400
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: minnano 榜单与头像更新 $(date -u +%F)"
            git push
          fi
