# 所有采集在一个串行入口完成，避免不同定时任务同时提交同一数据目录。
# GitHub 托管 runner 提供独立网络出口，但不能保证源站不会限流或拦截。
name: Collect atlas data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke 小规模验证；daily 正常采集'
        type: choice
        options: [smoke, daily]
        default: smoke
      source:
        description: 'ranked 三榜Top250累积人物（推荐）；其他为独立维护工具'
        type: choice
        options: [ranked, works, enrichment, all, minnano, javdb, male, directory, profiles]
        default: ranked
      directory_pages:
        description: 'directory 每轮最多页数（1–2000）；其他来源忽略'
        type: string
        default: '20'
      profile_limit:
        description: 'ranked/profiles 每轮最多补详情和头像数（1–1000），默认750'
        type: string
        default: '750'
      work_scope:
        description: 'works专用：trial两人验证；ranked榜单人物池分批轮转'
        type: choice
        options: [trial, ranked]
        default: trial
      include_works:
        description: 'daily + ranked后补作品及元数据（与每天定时相同）'
        type: boolean
        default: false
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 北京 05:30，实际运行可能延迟。

permissions:
  contents: write

concurrency:
  group: atlas-data
  cancel-in-progress: false

jobs:
  collect:
    # 每天北京时间05:30先更新榜单池，再按预算补作品；手动维护仍可单独运行。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 无第三方采集依赖，不需要 npm install；测试仅使用合成响应，不访问源站。
      - run: npm run check
      - run: npm test
      - name: 抓取与整理资料
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          SOURCE: ${{ inputs.source || 'ranked' }}
          # relay 是总根；脚本按 minnano/javdb/derived 分类，不能写 tools/relay。
          RELAY_DIR: relay
          DIRECTORY_PAGES: ${{ inputs.directory_pages || '20' }}
          BACKFILL_LIMIT: ${{ inputs.profile_limit || '750' }}
          # 本步骤只有source=works时使用这些预算；定时作品在后续独立步骤执行。
          WORK_SCOPE: ${{ inputs.work_scope || 'trial' }}
          WORK_PEOPLE: '5'
          WORK_PERSON_PAGES: '5'
          WORK_PAGES: '20'
          WORK_DETAILS: '50'
          WORK_REQUESTS: '100'
          # 无码样本约 203 页后不再新增，300 留余量；不代表全站覆盖。
          UC_PAGES: '300'
          MOVIE_PAGES: '40'
        run: |
          if npm run collect -- "$MODE" "$SOURCE"; then
            exit 0
          else
            code=$?
            # 作品退出码2表示来源暂不可用，已有有效数据和失败队列均已安全保存。
            # 允许提交该断点，下一台runner才能续跑；其他来源/程序错误仍阻断提交。
            if { [ "$SOURCE" = "works" ] || [ "$SOURCE" = "enrichment" ]; } && [ "$code" = "2" ]; then
              echo "::warning::部分作品资料未补齐，保存有效进度与待办；不代表完整采集"
              exit 0
            fi
            exit "$code"
          fi
      - name: 分批补齐榜单人物作品
        if: github.event_name == 'schedule' || (inputs.include_works && inputs.mode == 'daily' && inputs.source == 'ranked')
        env:
          RELAY_DIR: relay
          WORK_SCOPE: ranked
          WORK_PEOPLE: '5'
          WORK_PERSON_PAGES: '5'
          WORK_PAGES: '20'
          WORK_DETAILS: '50'
          WORK_REQUESTS: '100'
        run: |
          if npm run collect -- daily works; then
            exit 0
          else
            code=$?
            if [ "$code" = "2" ]; then
              echo "::warning::部分作品来源不可用，保存有效断点与失败待办"
              exit 0
            fi
            exit "$code"
          fi
      - name: 分批补齐作品评分与元数据
        if: github.event_name == 'schedule' || (inputs.include_works && inputs.mode == 'daily' && inputs.source == 'ranked')
        env:
          RELAY_DIR: relay
          ENRICH_LIMIT: '10'
          ENRICH_REQUESTS: '30'
          ENRICH_DELAY_MS: '1000'
        run: |
          if npm run collect -- daily enrichment; then
            exit 0
          else
            code=$?
            if [ "$code" = "2" ]; then
              echo "::warning::部分作品元数据未补齐，保留匹配记录及重试状态"
              exit 0
            fi
            exit "$code"
          fi
      - name: 生成作品覆盖报告
        run: npm run report:works -- --output relay/derived/work-coverage.json
      # 所有现场均上传；只有正常结束或工具明确返回的可恢复来源失败才允许提交。
      - name: 保存本轮产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: relay/
          retention-days: 7
      - name: 提交成功结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/
          if ! git diff --cached --quiet; then
            git commit -m "数据：保存资料更新与采集进度" -m "变更：保存本次采集的 JSON、头像与断点。" -m "原因：同步来源网站资料并支持下轮续跑。" -m "验证：离线检查通过；来源缺失与未完成待办以采集报告为准，数据质量待人工验收。" -m "限制：人物发现范围有限，无法确认的性别保留未知；保存进度不代表全量采集完成。"
            git push
          fi
