# 所有采集在一个串行入口完成，避免不同定时任务同时提交同一数据目录。
# GitHub 托管 runner 提供独立网络出口，但不能保证源站不会限流或拦截。
name: Collect atlas data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke 小规模验证；daily 正常采集'
        type: choice
        options: [smoke, daily]
        default: smoke
      source:
        description: 'ranked 三榜Top250累积人物（推荐）；其他为独立维护工具'
        type: choice
        options: [ranked, works, all, minnano, javdb, male, directory, profiles]
        default: ranked
      directory_pages:
        description: 'directory 每轮最多页数（1–2000）；其他来源忽略'
        type: string
        default: '20'
      profile_limit:
        description: 'ranked/profiles 每轮最多补详情和头像数（1–1000），默认750'
        type: string
        default: '750'
  schedule:
    - cron: '30 21 * * *' # UTC 21:30 = 北京 05:30，实际运行可能延迟。

permissions:
  contents: write

concurrency:
  group: atlas-data
  cancel-in-progress: false

jobs:
  collect:
    # 每天北京时间05:30执行 ranked；手动仍可选择维护工具，日常任务不再遍历全站。
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 无第三方采集依赖，不需要 npm install；测试仅使用合成响应，不访问源站。
      - run: npm run check
      - run: npm test
      - name: 抓取与整理资料
        env:
          MODE: ${{ inputs.mode || 'daily' }}
          SOURCE: ${{ inputs.source || 'ranked' }}
          # relay 是总根；脚本按 minnano/javdb/derived 分类，不能写 tools/relay。
          RELAY_DIR: relay
          DIRECTORY_PAGES: ${{ inputs.directory_pages || '20' }}
          BACKFILL_LIMIT: ${{ inputs.profile_limit || '750' }}
          # 无码样本约 203 页后不再新增，300 留余量；不代表全站覆盖。
          UC_PAGES: '300'
          MOVIE_PAGES: '40'
        run: npm run collect -- "$MODE" "$SOURCE"
      # 成功和失败都上传现场；失败产物只供排查，不会提交为有效更新。
      - name: 保存本轮产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collected-data
          path: relay/
          retention-days: 7
      - name: 提交成功结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/
          if ! git diff --cached --quiet; then
            git commit -m "数据：更新演员资料与榜单" -m "变更：保存本次采集的 JSON 与头像。" -m "原因：同步来源网站资料。" -m "验证：离线检查及选定采集步骤成功，数据质量待人工验收。" -m "限制：人物发现范围有限，无法确认的性别保留未知。"
            git push
          fi
