# JavDB 演员任务：先采集无码出演名单，再累积演员资料与头像。默认 UC_PAGES=300、MOVIE_PAGES=40；full 分别为 600、80。
# 定时表达式使用 UTC，注释中的北京时间为 UTC+8；触发不等于准点完成。
# concurrency 只防止同名任务重叠，不协调其他工作流的 git push。
# contents: write 用于提交产物；分支规则或仓库权限仍可能阻止 push。
# 源站可达性、IP 限流和身份判定须以实际运行结果为准。
name: actors-relay

on:
  schedule:
    - cron: '10 22 * * *' # UTC 22:10 = 北京 06:10（错开 rank-relay 21:30 / male-roster 21:40）
  workflow_dispatch:
    inputs:
      full:
        description: '填 full = 翻更多无码影片页（默认 260，约 203 页即饱和）'
        required: false
        default: ''

# 以下仅声明运行权限，不改变代码或文件的公开/私有属性。
permissions:
  contents: write

concurrency:
  group: actors-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELAY_DIR: relay
      UC_PAGES: ${{ inputs.full == 'full' && '600' || '300' }}
      MOVIE_PAGES: ${{ inputs.full == 'full' && '80' || '40' }}
    # checkout 获取当前仓库代码；setup-node 固定 Node 主版本；后续采集失败会阻止提交步骤。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓 JavDB 无码演员名单（翻 type=1 无码影片反推）
        run: node tools/uncensored-actresses-crawl.js
      - name: 抓 JavDB 全量演员 + 女优补图
        run: node tools/actors-full-crawl.js
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/uncensored_actresses.json relay/actors_full.json relay/actress_fix.json relay/avatars_jdb/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: JavDB 演员与无码名单更新 $(date -u +%F)"
            git push
          fi
