# JavDB 演员采集：先由无码影片反推人物，再更新演员集合与补图。
# 使用移动端 API 的应用级签名，无需用户账号；人物目录端点曾返回空，因此采用影片反推。
# 源站网络记录包括机房可访问、代理 WAF 403 与 Cloudflare 拦截，当前可达性需实测。
# schedule 使用 UTC，北京时间为 UTC+8；触发时间不保证实际开始或完成时间。
name: actors-relay

on:
  schedule:
    - cron: '10 22 * * *' # UTC 22:10 = 北京 06:10（错开 rank-relay 21:30 / male-roster 21:40）
  workflow_dispatch:
    inputs:
      full:
        description: '填 full = 翻更多无码影片页（默认 260，约 203 页即饱和）'
        required: false
        default: ''
# 提交采集结果需要 contents: write；仓库权限或分支规则仍可能拒绝写入。
permissions:
  contents: write

# 只限制本工作流的并行运行，不协调其他工作流的 git push。
concurrency:
  group: actors-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 显式固定仓库根 relay/；脚本位于 tools/，产物目录在其上一层。
      # 曾无条件写脚本同级 tools/relay/ 导致 ENOENT；脚本现在已有目录回退，仍保留此配置避免歧义。
      RELAY_DIR: relay
      # 无码影片分页样本约 203 页后不再发现新人物，默认留 300 页余量，不表示全站覆盖。
      # full 将无码上限扩为 600；演员采集为每维度 40 页，full 为 80 页。
      UC_PAGES: ${{ inputs.full == 'full' && '600' || '300' }}
      MOVIE_PAGES: ${{ inputs.full == 'full' && '80' || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 网页检查 https://javdb.com/actors/<id> 的全部 section-meta，含“男優”判男性。
      # 网页可能直连成功，也曾在 Actions 中返回 403；失败按脚本的旧名单或默认值兜底。
      # 名字反查优先 female_names.json，再回退 actresses.json，不能因后者缺失就认定整级跳过。
      # 当前仓库不预置这两份数据，缺失时需要关注 genderSource，不能将默认性别当作确认结果。
      - name: 抓 JavDB 无码演员名单（翻 type=1 无码影片反推）
        run: node tools/uncensored-actresses-crawl.js
      - name: 抓 JavDB 全量演员 + 女优补图
        run: node tools/actors-full-crawl.js
      - name: 提交 relay 数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relay/uncensored_actresses.json relay/actors_full.json relay/actress_fix.json relay/avatars_jdb/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "relay: JavDB 演员与无码名单更新 $(date -u +%F)"
            git push
          fi
